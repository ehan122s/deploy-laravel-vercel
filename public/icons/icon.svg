<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001633" />
      <stop offset="50%" stop-color="#002D62" />
      <stop offset="100%" stop-color="#07458C" />
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base for standalone icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="4" />

  <!-- Center Vault / Geometric Shield Graphic (Safe within 80% circle) -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Outer Shield Frame -->
    <path d="M 256 95 
             L 375 140 
             C 375 250 325 345 256 385 
             C 187 345 137 250 137 140 
             Z" 
          fill="#001F47" 
          stroke="url(#cyanGrad)" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Inner Emerald Core (Financial Growth Symbol) -->
    <path d="M 256 135 
             L 345 170 
             C 345 255 305 325 256 355 
             C 207 325 167 255 167 170 
             Z" 
          fill="url(#bgGrad)" />

    <!-- Upward Growth Dynamic Bars / Arrows -->
    <!-- Left bar -->
    <rect x="200" y="245" width="26" height="60" rx="8" fill="#38BDF8" />
    <!-- Center bar (tallest) -->
    <rect x="243" y="195" width="26" height="110" rx="8" fill="url(#emeraldGrad)" />
    <!-- Right bar -->
    <rect x="286" y="225" width="26" height="80" rx="8" fill="#10B981" />

    <!-- Sleek Check / Transaction Verification Swish -->
    <circle cx="256" cy="180" r="14" fill="#34D399" />
  </g>

  <!-- Modern Monogram / Wordmark: BRILink -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#FFFFFF">
    BRILINK
  </text>
  <text x="256" y="475" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="19" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#34D399">
    MANAGEMENT
  </text>
</svg>
